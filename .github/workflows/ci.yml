name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      # Tests use mock repositories and fake HTTP transports: no backend or
      # API key is needed.
      - name: Run tests
        run: flutter test
